name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check server
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Build client
        run: npm run build --prefix client

      - name: Build server
        run: npm run build --prefix server

      - name: Run all automated tests (Server & Client)
        run: npm test

      - name: Verify package deliverables generation
        run: |
          npm run build:desktop
          npm run build:apk
          test -f dist-linux/stremo-linux-x64-v1.0.0.tar.gz
          test -f dist-android/stremo-v1.0.0-universal.apk
